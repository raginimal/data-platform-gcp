name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Gate 1 - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build artifact
        id: build
        run: bash scripts/build-artifact.sh
      - name: Summarize build
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
        shell: bash
        run: |
          {
            echo "## Build"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Artifact build | $BUILD_RESULT |"
            if [[ -f dist/artifact-manifest.json ]]; then
              echo
              echo "### Artifact"
              echo
              echo '```json'
              cat dist/artifact-manifest.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  core-repository:
    name: Core repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate baseline repository
        id: validate
        run: bash scripts/validate.sh
      - name: Summarize repository validation
        if: always()
        env:
          VALIDATION_RESULT: ${{ steps.validate.outcome }}
        run: |
          {
            echo "## Core repository validation"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Repository structure and baseline | $VALIDATION_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

  advisory-review:
    name: Gate 5 - Advisory AI review
    runs-on: ubuntu-latest
    needs: [build, core-repository]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Route changes to advisory reviewers
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          ADVISORY_REPORT_FILE: ${{ runner.temp }}/advisory-report.md
        run: bash scripts/advisory-review.sh
      - name: Publish advisory report on the pull request
        # Fork PRs get a read-only token; the job summary still carries the report.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORT: ${{ runner.temp }}/advisory-report.md
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file "$REPORT"
