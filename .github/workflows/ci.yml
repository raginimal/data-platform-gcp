name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Gate 1 - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build artifact
        run: bash scripts/build-artifact.sh

  core-repository:
    name: Core repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate baseline repository
        run: bash scripts/validate.sh

  advisory-review:
    name: Gate 5 - Advisory AI review
    runs-on: ubuntu-latest
    needs: [build, core-repository]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Route changes to advisory reviewers
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/advisory-review.sh
